{% extends "base.html" %}

{% block title %}
Edit Profile
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <h1 class="mb-4">
            Edit Profile
        </h1>

        {% if profile.avatar %}
            <img
                src="{{ profile.avatar.url }}"
                class="rounded-circle mb-4"
                width="120"
                height="120"
                style="object-fit: cover;"
            >
        {% endif %}

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p}}
            <button class="btn btn-primary" type="submit">
                Save Changes
            </button>
        </form>
    </div>
</div>
{% endblock %}
