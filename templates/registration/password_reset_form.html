{% extends "base.html" %}

{% block title %}
Forgot Password
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow-sm">

            <div class="card-body">

                <h2 class="mb-4">
                    Forgot your password?
                </h2>

                <p>
                    Enter your email address below and we'll send you a secure password reset link.
                </p>

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Send Reset Link
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
