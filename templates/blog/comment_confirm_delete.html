{% extends "base.html" %}

{% block title %}
Delete Comment
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-6">

        <div class="card">

            <div class="card-body">

                <h2 class="text-danger">

                    Delete Comment

                </h2>

                <p class="mt-3">

                    Are you sure you want to delete this comment?

                </p>

                <blockquote class="border-start ps-3">

                    {{ comment.body }}

                </blockquote>

                <form method="post">

                    {% csrf_token %}

                    <button
                        type="submit"
                        class="btn btn-danger"
                    >
                        Delete
                    </button>

                    <a
                        href="{% url 'blog:comment_list' %}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
