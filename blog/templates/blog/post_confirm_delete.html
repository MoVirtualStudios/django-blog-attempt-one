{% extends "base.html" %}

{% block title %}
Delete Post
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col=lg-6">
        <div = "card">
            <div class="card-body">
                <h2 class="text-danger">
                    Delete Post
                </h2>
                <p class="mt-4">
                    Are you sure you want to delete this post?
                    <strong>
                        "{{ post.title }}"
                    </strong>
                </p>
                <form method="post">
                    {% csrf_token %}
                    <button type="subtmit" class="btn btn-danger">
                        Delete
                    </button>
                    <a href="{% url 'accounts:dashboard' %}" class="btn btn-secondary">
                        Cancel
                    <a/>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
