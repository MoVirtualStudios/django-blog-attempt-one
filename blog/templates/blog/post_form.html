{% extends "base.html" %}

{% block title %}
Manage Post
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <h1 class="mb-4">
            {% if editing %}
                Edit Post
            {% else %}
                Create New Post
            {% endif %}
            
        </h1>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}

            <button class="btn btn-primary" type="submit">
                {% if editing %}
                    Update Post
                {% else %}
                    Save Post
                {% endif %}
                
            </button>
        </form>
    </div>

</div>
{% endblock %}
